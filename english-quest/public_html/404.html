<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>404 · Mochi đi lạc rồi!</title>
<style>
:root{font-family:ui-rounded,"Segoe UI",system-ui,sans-serif;color:#414260;background:#faf7ff}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 15% 15%,#ffe4ee,transparent 48%),radial-gradient(ellipse at 90% 80%,#e0f4ff,transparent 50%),#faf7ff}header{max-width:1120px;margin:auto;padding:28px 30px;font-size:19px;font-weight:850;letter-spacing:1px}header a{color:inherit;text-decoration:none}header b{color:#9874d4}main{max-width:1060px;margin:35px auto 24px;padding:38px 45px;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:25px;background:#ffffffc9;border:2px solid white;border-radius:38px;box-shadow:0 20px 70px #8270b612}.tag{display:inline-block;padding:9px 15px;border-radius:25px;background:#f0eaff;color:#8b68c1;font-size:12px;font-weight:800;letter-spacing:1px}h1{font-size:clamp(32px,4.5vw,48px);line-height:1.18;letter-spacing:-1.5px;margin:24px 0 18px}p{font-size:16px;line-height:1.8;color:#797a94;max-width:400px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0}button,.button{font:inherit;font-weight:750;border-radius:17px;padding:14px 20px;border:0;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.button{background:#9270ce;color:white;box-shadow:0 5px 0 #7856b0}button{background:#eeebf6;color:#6d6087}button:hover,.button:hover{transform:translateY(-2px)}a:focus-visible,button:focus-visible{outline:3px solid #547ac5;outline-offset:5px}.scene{position:relative;min-height:390px;display:grid;place-items:center}.number{position:absolute;top:0;font-size:150px;font-weight:950;letter-spacing:8px;color:#e8dff9;line-height:1}.scene img{position:relative;width:100%;max-width:350px;height:auto;filter:drop-shadow(0 20px 16px #8b77ab20);animation:bob 4s ease-in-out infinite}.star{position:absolute;color:#e5b66b;font-size:32px;top:45%;left:4%;transform:rotate(-15deg)}.star.two{left:auto;right:0;top:22%;color:#b297df;font-size:24px}.note{position:absolute;bottom:4px;padding:10px 16px;background:#fff8e9;border:1px solid #f6e8ca;border-radius:14px;font-size:13px;color:#9a8054;transform:rotate(-4deg)}small{color:#a8a1b8;font-size:12px}footer{text-align:center;font-size:13px;color:#9b93ab;padding:15px 20px 30px}@keyframes bob{50%{transform:translateY(-10px) rotate(2deg)}}@media(max-width:700px){header{padding:22px;font-size:16px}main{margin:8px 16px;padding:26px;grid-template-columns:1fr;border-radius:28px;gap:4px}.scene{grid-row:1;min-height:270px}.scene img{max-width:240px}.number{font-size:110px}.copy{text-align:center}.copy p{margin:auto}.actions{justify-content:center}h1{margin-top:18px}}@media(prefers-reduced-motion:reduce){.scene img{animation:none}button:hover,.button:hover{transform:none}}
</style>
</head>
<body>
<header><a data-home href="/">ENGLISH <b>QUEST</b> ✦</a></header>
<main>
<section class="copy"><span class="tag">MỘT CHÚT ĐI LẠC, MỘT CHÚT DỄ THƯƠNG</span><h1>Ối! Mochi rẽ<br>nhầm đường rồi!</h1><p>Trang bạn tìm có thể đã chuyển nhà hoặc chưa xuất hiện trên bản đồ. Về nhà cùng Mochi nhé?</p><div class="actions"><a class="button" data-home href="/">Về trang chủ&nbsp; ↗</a><button id="back" type="button">← Quay lại</button></div><small>MÃ LỖI 404 · KHÔNG TÌM THẤY TRANG</small></section>
<div class="scene"><span class="number" aria-hidden="true">404</span><span class="star" aria-hidden="true">✦</span><span class="star two" aria-hidden="true">✧</span><img id="mochi" alt="Mochi cầm bản đồ, tìm đường trở về học viện" width="350" height="350"><span class="note">Nhà ở hướng này nè! ↗</span></div>
</main><footer>Đang đưa bạn về trang chủ sau <strong id="countdown">5</strong> giây… ♡</footer>
<script>
const base=location.hostname==='software-development-data.github.io'?'/english/':'/';
document.querySelectorAll('[data-home]').forEach(a=>a.href=base);
document.getElementById('mochi').src=base+'pets/mochi-lost.webp';
let remaining=5;
const redirectTimer=setInterval(()=>{remaining--;document.getElementById('countdown').textContent=String(remaining);if(remaining<=0){clearInterval(redirectTimer);location.replace(base)}},1000);
document.getElementById('back').addEventListener('click',()=>{let sameOrigin=false;try{sameOrigin=new URL(document.referrer).origin===location.origin}catch{}if(sameOrigin&&history.length>1)history.back();else location.assign(base)});
</script>
</body></html>
